; Build/Upload without -e: the ESP32-S3 firmware, as before the P4 builds
[platformio]
default_envs = esp32-s3-standard

; Impostazioni condivise per tutti i firmware ESP32
[env]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------------------------------------------------------
; 1. Environment per Firmware ESP32-S3 (Universal 8MB DIO, Wi-Fi)
; ---------------------------------------------------------
[env:esp32-s3-standard]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
test_build_src = true
; The precompiled Arduino core ignores sdkconfig.defaults: the core dump to flash stays
; enabled. The wrap lets CrashDiag skip it when the partition table (OTA-updated boards)
; has no coredump partition, so a panic completes and reboots (issue #47, ADR 0008).
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------
; 2. ESP32-P4 with wired Ethernet (Waveshare ESP32-P4-ETH and clones)
; ---------------------------------------------------------
; The P4 has no radio: the network is the on-chip EMAC + IP101 PHY over RMII, and the
; UPS goes on the USB 2.0 OTG High-Speed port. It needs a newer Arduino core (3.3.x,
; ESP-IDF 5.5) than the S3 build, which stays pinned to its tested platform.
; The Ethernet pins default to the Arduino ESP32-P4 variant (Espressif reference design:
; IP101 PHY addr 1, MDC 31, MDIO 52, reset 51, RMII clock in on 50), which is also the
; Waveshare ESP32-P4-ETH wiring.
[p4_common]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/chip_rev.py
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
    -DNUT_NET_ETHERNET=1
    -DDIAG_LED_DISABLED=1
    ; Other boards: -DNUT_ETH_PHY_TYPE=ETH_PHY_xxx -DNUT_ETH_PHY_ADDR= -DNUT_ETH_PHY_MDC=
    ; -DNUT_ETH_PHY_MDIO= -DNUT_ETH_PHY_POWER= -DNUT_ETH_CLK_MODE=, and
    ; -DNUT_USB_PERIPHERAL_MAP=BIT1 for a UPS on the Full-Speed USB port
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ESP32-P4 silicon v3.1+ (current production chips)
[env:esp32-p4-eth]
extends = p4_common
board = esp32-p4_r3-evboard

; ESP32-P4 silicon before v3 (v1.x, early boards). The libraries differ from v3: the
; image header carries the revision range (scripts/chip_rev.py), so the bootloader and
; the OTA check refuse the wrong one. `esptool.py chip_id` prints the revision
[env:esp32-p4-eth-v1]
extends = p4_common
board = esp32-p4-evboard

; ---------------------------------------------------------
; 3. Environment per i Test (Native)
; ---------------------------------------------------------
[env:native]
platform = native
platform_packages =
    toolchain-gccmingw32
test_framework = unity
test_build_src = true
lib_ignore =
    USBHostUPS
    DiagnosticLED
    NUTServer
test_ignore = test_diagnostic_led, test_network_manager, test_ota_handler, test_system_state, test_usb_host, integration, test_config_manager
build_src_filter =
    -<*>
    +<../lib/USBHostUPS/src/HIDParser.cpp>
    +<../lib/USBHostUPS/src/APCDriver.cpp>
    +<../lib/USBHostUPS/src/CyberPowerDriver.cpp>
    +<../lib/USBHostUPS/src/OpenUPSDriver.cpp>
    +<../lib/USBHostUPS/src/EatonDriver.cpp>
    +<../lib/USBHostUPS/src/EcoFlowDriver.cpp>
    +<../lib/USBHostUPS/src/GenericDriver.cpp>
    +<../lib/USBHostUPS/src/PowercomDriver.cpp>
    +<../lib/USBHostUPS/src/DriverRegistry.cpp>
    +<../lib/NUTServer/src/NUTServer.cpp>
build_flags =
    -std=gnu++17
    -I test/mocks
    -I lib/USBHostUPS/src
    -I lib/NUTServer/src

