name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/firmware.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist

      # docs/releases/<tag>.md is optional: when the tagged commit has it, it is
      # the release body; otherwise GitHub generates the notes from the merged PRs.
      # Notes written after the tag are applied by release-notes.yml.
      - name: Prepare release notes
        id: notes
        run: |
          NOTES="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then
            python scripts/release_notes.py "$NOTES" > release-body.md
            echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NOTES not found, using GitHub generated notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: dist/firmware-*/esp32-nut-*.zip

      # The S3 files stay at the site root (manifest.json, as before); each P4 build
      # gets its own folder and manifest, picked from the installer page
      - name: Prepare Web Installer
        run: |
          cp dist/firmware-esp32-s3-standard/release-pkg/* web-installer/
          mkdir -p web-installer/p4 web-installer/p4-v1
          cp dist/firmware-esp32-p4-eth/release-pkg/* web-installer/p4/
          cp dist/firmware-esp32-p4-eth-v1/release-pkg/* web-installer/p4-v1/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-installer
